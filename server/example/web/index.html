<!doctype html>
<html lang="en" class="ds-theme ds-base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Example</title>
<!-- Z-Dash and the shell come from the server (/z-dash/...). No inline script or style: the
     Content-Security-Policy forbids them. -->
<link rel="stylesheet" href="/z-dash/fonts/fonts.css">
<link rel="stylesheet" href="/z-dash/ds.min.css">
<link rel="stylesheet" href="/z-dash/themes/dark.css" media="(prefers-color-scheme: dark)">
<script src="/z-dash/ds.min.js" defer></script>
<script type="module" src="app.js"></script>
</head>
<body>
<!-- The app's layout, hidden until someone is signed in (the shell shows the sign-in card meanwhile). -->
<div class="ds-app ds-app--drawer" data-ds-shell="example" hidden>
  <a class="ds-skip" href="#main">Skip to content</a>
  <div class="ds-topbar">
    <button class="ds-btn ds-btn--quiet ds-btn--icon ds-topbar__menu" type="button" aria-label="Menu" aria-expanded="false" data-icon="menu"></button>
    <a class="ds-brand" href="/"><span class="ds-brand__name" data-zs-name>Example</span></a>
    <div class="ds-account ds-account--capsule" data-zs-account></div>
  </div>
  <div class="ds-scrim"></div>
  <nav class="ds-drawer" aria-label="Main" tabindex="-1">
    <div class="ds-drawer__head" aria-hidden="true"><span class="ds-brand__name" data-zs-name>Example</span></div>
    <div class="ds-drawer__list">
      <div class="ds-drawer__group">
        <a class="ds-drawer__item" href="/" aria-current="page" data-icon="laptop" data-icon-place="start"><span class="ds-drawer__label">Devices</span></a>
        <a class="ds-drawer__item" href="/z-dash/server/" data-icon="settings" data-icon-place="start"><span class="ds-drawer__label">Server settings</span></a>
      </div>
    </div>
  </nav>
  <div class="ds-panel">
    <main class="ds-view" id="main" tabindex="-1">
      <div class="ds-content">
        <div class="ds-page">
          <header class="ds-page-head">
            <h1 class="ds-page-head__title" tabindex="-1">Devices</h1>
            <p class="ds-page-head__lead">Every device in the database, live: a change in another browser shows here too.</p>
          </header>
          <div class="ds-stack">
            <form class="ds-card ds-form" id="add-device" novalidate aria-labelledby="add-title">
              <h2 class="ds-card__title" id="add-title">Add a device</h2>
              <div class="ds-form-grid ds-form-grid--2">
                <div class="ds-field">
                  <label class="ds-field__label" for="device-name">Name</label>
                  <input class="ds-input" id="device-name" name="name" autocomplete="off" required>
                </div>
                <div class="ds-field">
                  <label class="ds-field__label" for="device-room">Room <span class="ds-field__optional">· optional</span></label>
                  <input class="ds-input" id="device-room" name="room" autocomplete="off">
                </div>
              </div>
              <div class="ds-form-actions">
                <button class="ds-btn ds-btn--filled" type="submit"><span class="ds-btn__faces">
                  <span class="ds-btn__face">Add device</span>
                  <span class="ds-btn__face ds-btn__face--busy" aria-hidden="true"><span class="ds-spinner ds-spinner--ink ds-sm"></span>Adding</span>
                </span></button>
              </div>
            </form>
            <section class="ds-card" aria-labelledby="list-title">
              <h2 class="ds-card__title" id="list-title">Devices</h2>
              <div id="devices"><div class="ds-loading" role="status"><span class="ds-loader ds-sm" aria-hidden="true"></span>Loading devices</div></div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<!-- Right after .ds-app: DS.overlay.toast() shows its snackbars here. -->
<div class="ds-toasts"></div>
</body>
</html>
